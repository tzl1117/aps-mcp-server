swagger: '2.0'
info:
  title: Autodesk Platform Services MCP Server
  description: Model Context Protocol server providing access to Autodesk Construction Cloud data via APS APIs
  version: 1.0.0
host: localhost:3000
basePath: /
schemes:
  - https
  - http
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Autodesk Platform Services MCP Endpoint
      description: MCP Streamable endpoint for Microsoft Copilot Studio integration
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
                example: "2.0"
                description: JSON-RPC version
              id:
                type: string
                example: "1"
                description: Request ID
              method:
                type: string
                example: "tools/call"
                description: MCP method name
              params:
                type: object
                description: Method parameters
                properties:
                  name:
                    type: string
                    example: "get-accounts"
                    description: Tool name
                  arguments:
                    type: object
                    description: Tool arguments
            required:
              - jsonrpc
              - method
      responses:
        '200':
          description: Successful MCP response
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
                example: "2.0"
              id:
                type: string
                example: "1"
              result:
                type: object
                description: Response data
        '400':
          description: Bad request - Invalid JSON-RPC format
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                type: string
              error:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
        '500':
          description: Internal server error
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                type: string
              error:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
  /health:
    get:
      summary: Health Check
      description: Server health status endpoint
      operationId: HealthCheck
      responses:
        '200':
          description: Server is healthy
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ok"
              timestamp:
                type: string
                format: date-time
              server:
                type: string
                example: "APS MCP Streamable Server"
              version:
                type: string
                example: "1.0.0"
  /mcp/info:
    get:
      summary: Server Information
      description: Get server capabilities and available tools
      operationId: GetServerInfo
      responses:
        '200':
          description: Server information
          schema:
            type: object
            properties:
              server:
                type: string
              version:
                type: string
              protocol:
                type: string
              supportedMethods:
                type: array
                items:
                  type: string
              availableTools:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
definitions:
  MCPRequest:
    type: object
    required:
      - jsonrpc
      - method
    properties:
      jsonrpc:
        type: string
        enum: ["2.0"]
      id:
        type: string
      method:
        type: string
        enum: ["initialize", "tools/list", "tools/call"]
      params:
        type: object
  MCPResponse:
    type: object
    required:
      - jsonrpc
    properties:
      jsonrpc:
        type: string
        enum: ["2.0"]
      id:
        type: string
      result:
        type: object
      error:
        type: object
        properties:
          code:
            type: integer
          message:
            type: string
          data:
            type: object
