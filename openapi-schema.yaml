swagger: '2.0'
info:
  title: Autodesk Platform Services MCP Server
  description: Model Context Protocol server providing access to Autodesk Construction Cloud data via APS APIs
  version: 1.0.0
host: aps-mcp-server-1-bnhqa4cce3ese7ew.centralus-01.azurewebsites.net
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Autodesk Platform Services MCP Endpoint
      description: MCP Streamable endpoint for Microsoft Copilot Studio integration
      operationId: InvokeMCP
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: mcpRequest
          in: body
          required: true
          description: MCP JSON-RPC request
          schema:
            $ref: '#/definitions/MCPRequest'
      responses:
        '200':
          description: Successful MCP response
          schema:
            $ref: '#/definitions/MCPResponse'
        '400':
          description: Bad request - Invalid JSON-RPC format
          schema:
            $ref: '#/definitions/MCPErrorResponse'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/MCPErrorResponse'
  /health:
    get:
      summary: Health Check
      description: Server health status endpoint
      operationId: HealthCheck
      responses:
        '200':
          description: Server is healthy
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ok"
              timestamp:
                type: string
                format: date-time
              server:
                type: string
                example: "APS MCP Streamable Server"
              version:
                type: string
                example: "1.0.0"
  /mcp/info:
    get:
      summary: Server Information
      description: Get server capabilities and available tools
      operationId: GetServerInfo
      responses:
        '200':
          description: Server information
          schema:
            type: object
            properties:
              server:
                type: string
              version:
                type: string
              protocol:
                type: string
              supportedMethods:
                type: array
                items:
                  type: string
              availableTools:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
definitions:
  MCPRequest:
    type: object
    required:
      - jsonrpc
      - method
    properties:
      jsonrpc:
        type: string
        example: "2.0"
        description: JSON-RPC version (must be "2.0")
      id:
        type: string
        example: "1"
        description: Request ID
      method:
        type: string
        example: "tools/call"
        description: MCP method name (initialize, tools/list, tools/call)
      params:
        type: object
        description: Method parameters
        properties:
          name:
            type: string
            example: "get-accounts"
            description: Tool name (for tools/call method)
          arguments:
            type: object
            description: Tool arguments (for tools/call method)
  MCPResponse:
    type: object
    required:
      - jsonrpc
    properties:
      jsonrpc:
        type: string
        example: "2.0"
        description: JSON-RPC version
      id:
        type: string
        example: "1"
        description: Request ID
      result:
        type: object
        description: Response data when successful
  MCPErrorResponse:
    type: object
    required:
      - jsonrpc
    properties:
      jsonrpc:
        type: string
        example: "2.0"
        description: JSON-RPC version
      id:
        type: string
        example: "1"
        description: Request ID
      error:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: integer
            example: -32603
            description: Error code
          message:
            type: string
            example: "Tool execution failed"
            description: Error message
          data:
            type: string
            example: "Additional error details"
            description: Additional error information
